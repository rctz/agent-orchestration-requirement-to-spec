"เพิ่มสินค้าลงตะกร้า": "Type an integer 1-99 in the quantity field and press add; adding a product already in the cart merges quantities into that line (capped by the same 1-99 validation)"
"ยืนยันก่อนหรือไม่": "No confirmation: clear the cart immediately (v2 spec has an immediate clear button)"
