# req3 — docker compose (design §13).
# First real deployment in M4 via scripts/deploy.sh; hardened in M9
# (healthchecks, memory limits, host repo dir mount for repo_allowed_roots).
name: req3
services:
  gateway:
    build:
      context: .
      dockerfile: docker/gateway.Dockerfile
    ports:
      - "7790:7790"        # published; ufw rule needs owner approval (M9)
    env_file: .env
    environment:
      REQ3_CONFIG: /app/config.yaml
    volumes:
      - req3-data:/data
    depends_on:
      - opencode
    restart: unless-stopped
  opencode:
    build:
      context: .
      dockerfile: docker/opencode.Dockerfile
    # internal only — port 4096 is never published (design §11)
    env_file: .env
    volumes:
      - req3-data:/data
    restart: unless-stopped
volumes:
  req3-data:
